<script>
"use strict";
const PANEL_W = 1100, PANEL_H = 760;
const SL = typeof SLIDES === "undefined" ? null : SLIDES;   // missing until demo_slides.py has run
const PANEL_ONLY = /[?&]panel\b/.test(location.search);
if (PANEL_ONLY) document.body.classList.add("panelonly");
const STEPS = LESSON.steps.concat([{ title: "Training it yourself", live: true }]);
const N = STEPS.length;
const NS = "http://www.w3.org/2000/svg";
const MONO = "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function h(tag, cls, parent, text) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; if (parent) parent.appendChild(e); return e;
}
const CH = LESSON.chars, V = CH.length, IDX = Object.fromEntries(CH.map((c, i) => [c, i]));
const VOWELS = new Set("aeiou");

// ---- Python highlighting (keywords, strings, numbers, comments) -----------------
const KW = new Set("import as from def class return for in while if else elif with not and or break True False None lambda".split(" "));
function highlight(pre, code) {
  const re = /(#.*$)|("[^"]*"|'[^']*')|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/gm;
  let m;
  while ((m = re.exec(code))) {
    if (m[1]) h("span", "c", pre, m[1]);
    else if (m[2]) h("span", "s", pre, m[2]);
    else if (m[3]) h("span", "n", pre, m[3]);
    else if (m[4] && KW.has(m[4])) h("span", "k", pre, m[4]);
    else pre.appendChild(document.createTextNode(m[0]));
  }
}
function cellBox(kind, label, text, right) {
  const box = h("div", "cell " + kind);
  const lab = h("div", "lab", box); h("span", "", lab, label); if (right) h("span", "", lab, right);
  const pre = h("pre", "", box);
  if (kind === "code") highlight(pre, text); else pre.textContent = text;
  return box;
}

// ---- pictures ------------------------------------------------------------------------
function svgIn(box) { const s = el("svg", {}, box); const W = box.clientWidth, H = box.clientHeight; s.setAttribute("viewBox", `0 0 ${W} ${H}`); return [s, W, H]; }
function drawEmb(box, vis) {
  const [s, W, H] = svgIn(box), E = vis.E, mark = new Set(vis.mark || []);
  el("text", { x: 14, y: 26, "font-size": 17, fill: css("--muted") }, s, vis.G ? "the table E, and −gradient (enlarged)" : "the table E: one point per character");
  let m = 0.5; for (const v of E) m = Math.max(m, Math.abs(v)); m *= 1.12;
  const sz = Math.min(W - 40, H - 76), x0 = (W - sz) / 2, y0 = 40;
  const X = (a) => x0 + sz / 2 + a / m * sz / 2, Y = (b) => y0 + sz / 2 - b / m * sz / 2;
  el("rect", { x: x0, y: y0, width: sz, height: sz, fill: "none", stroke: css("--rule") }, s);
  el("line", { x1: x0, x2: x0 + sz, y1: Y(0), y2: Y(0), stroke: css("--grid") }, s);
  el("line", { x1: X(0), x2: X(0), y1: y0, y2: y0 + sz, stroke: css("--grid") }, s);
  if (vis.G) {
    let gm = 1e-9; for (const g of vis.G) gm = Math.max(gm, Math.abs(g));
    const k = 0.18 * m / gm;
    for (let v = 0; v < V; v++) {
      const a = E[2 * v], b = E[2 * v + 1], ga = -vis.G[2 * v] * k, gb = -vis.G[2 * v + 1] * k;
      if (Math.hypot(ga, gb) < 1e-9) continue;
      el("line", { x1: X(a), y1: Y(b), x2: X(a + ga), y2: Y(b + gb), stroke: css("--num"), "stroke-width": 2.5 }, s);
      el("circle", { cx: X(a + ga), cy: Y(b + gb), r: 3.5, fill: css("--num") }, s);
    }
  }
  for (let v = 0; v < V; v++) {
    const a = E[2 * v], b = E[2 * v + 1];
    const col = v === 0 ? css("--pos") : VOWELS.has(CH[v]) ? css("--err") : css("--line");
    if (mark.has(v)) el("circle", { cx: X(a), cy: Y(b), r: 15, fill: css("--hl"), stroke: css("--num") }, s);
    el("text", { x: X(a), y: Y(b) + 7, "text-anchor": "middle", "font-size": 21, "font-weight": 700, "font-family": MONO, fill: col }, s, CH[v]);
  }
  el("text", { x: x0, y: y0 + sz + 24, "font-size": 16, fill: css("--muted") }, s, "vowels red, consonants blue, “.” green");
}
function drawBars(box, vis) {
  const [s, W, H] = svgIn(box), p = vis.p;
  el("text", { x: 14, y: 26, "font-size": 17, fill: css("--muted") }, s, `P(next character | “${vis.ctx}”)`);
  let mx = 1e-9; for (const q of p) mx = Math.max(mx, q);
  const top = [...p.keys()].sort((a, b) => p[b] - p[a]).slice(0, 3), x0 = 12, w = (W - 24) / V, base = H - 30, hh = base - 70;
  for (let v = 0; v < V; v++) {
    const bh = p[v] / mx * hh, col = v === vis.y ? css("--pos") : top.includes(v) ? css("--err") : css("--line");
    el("rect", { x: x0 + v * w + 1.5, y: base - bh, width: w - 3, height: bh, fill: col }, s);
    el("text", { x: x0 + v * w + w / 2, y: H - 9, "text-anchor": "middle", "font-size": 16, "font-family": MONO, fill: css("--muted") }, s, CH[v]);
  }
  const lab = top.map((v) => `${CH[v]} ${p[v].toFixed(3)}`).join("   ");
  el("text", { x: W - 14, y: 54, "text-anchor": "end", "font-size": 17, "font-family": MONO, fill: css("--err") }, s, lab);
  if (vis.y !== undefined) el("text", { x: W - 14, y: 78, "text-anchor": "end", "font-size": 17, "font-family": MONO, fill: css("--pos") }, s, `correct: ${CH[vis.y]} ${p[vis.y].toFixed(3)}`);
}
function drawPairs(box, vis) {
  const [s, W] = svgIn(box);
  el("text", { x: 14, y: 26, "font-size": 17, fill: css("--muted") }, s, "context (X)  →  next character (Y)");
  vis.rows.forEach(([c, y], i) => {
    const yy = 76 + i * 50;
    el("text", { x: W / 2 - 30, y: yy, "text-anchor": "end", "font-size": 30, "font-family": MONO, fill: css("--ink") }, s, c);
    el("text", { x: W / 2, y: yy, "text-anchor": "middle", "font-size": 26, fill: css("--muted") }, s, "→");
    el("text", { x: W / 2 + 30, y: yy, "font-size": 30, "font-weight": 700, "font-family": MONO, fill: css("--err") }, s, y);
  });
}
function drawCurve(box, vis) {
  const [s, W, H] = svgIn(box);
  const px = 58, py = 40, pw = W - px - 16, ph = H - py - 62, lo = 1.0, hi = 4.0, T = vis.xmax;
  const LX = (x) => px + x / T * pw, LY = (l) => py + ph - (Math.min(hi, Math.max(lo, l)) - lo) / (hi - lo) * ph;
  el("text", { x: 14, y: 26, "font-size": 17, fill: css("--muted") }, s, vis.ylabel || "loss");
  for (let l = 1; l <= 4; l += 0.5) {
    el("line", { x1: px, x2: px + pw, y1: LY(l), y2: LY(l), stroke: css("--grid") }, s);
    el("text", { x: px - 7, y: LY(l) + 5, "text-anchor": "end", "font-size": 15, fill: css("--muted") }, s, l.toFixed(1));
  }
  el("rect", { x: px, y: py, width: pw, height: ph, fill: "none", stroke: css("--rule") }, s);
  for (let i = 0; i <= 4; i++) el("text", { x: LX(T * i / 4), y: py + ph + 20, "text-anchor": "middle", "font-size": 15, fill: css("--muted") }, s, Math.round(T * i / 4));
  el("text", { x: px + pw, y: py + ph + 42, "text-anchor": "end", "font-size": 15, fill: css("--muted") }, s, vis.xlabel);
  if (vis.ref) { el("line", { x1: px, x2: px + pw, y1: LY(vis.ref), y2: LY(vis.ref), stroke: css("--muted"), "stroke-dasharray": "5 4" }, s);
    el("text", { x: px + pw - 6, y: LY(vis.ref) - 6, "text-anchor": "end", "font-size": 15, fill: css("--muted") }, s, "ln 27 = 3.30"); }
  vis.series.forEach((se, i) => {
    const pts = se.pts.filter((q) => isFinite(q[1]));
    if (pts.length > 1) el("path", { d: pts.map((q, j) => (j ? "L" : "M") + LX(q[0]).toFixed(1) + " " + LY(q[1]).toFixed(1)).join(""),
      fill: "none", stroke: css("--" + se.c), "stroke-width": 3 }, s);
    else if (pts.length === 1) el("circle", { cx: LX(pts[0][0]), cy: LY(pts[0][1]), r: 4, fill: css("--" + se.c) }, s);
    el("text", { x: px + 12, y: py + ph - 14 - (vis.series.length - 1 - i) * 24, "font-size": 17, "font-weight": 600, fill: css("--" + se.c) }, s, se.name);
  });
}
const DRAW = { emb: drawEmb, bars: drawBars, pairs: drawPairs, curve: drawCurve };

// ---- one recorded step: the cell, its output, and a picture ------------------------
function showCell(k) {
  const st = STEPS[k], P = document.getElementById("panel"); P.innerHTML = "";
  const codeLines = st.code.split("\n").length, outLines = st.out ? st.out.split("\n").length : 0;
  P.appendChild(cellBox("code", `In [${k + 1}]`, st.code, "Python"));
  if (st.vis) {
    const row = h("div", "row", P);
    if (st.out) row.appendChild(cellBox("out", "Out", st.out));
    const v = h("div", "vis", row);
    if (!st.out) v.style.flexBasis = "100%";
    requestAnimationFrame(() => DRAW[st.vis.kind](v, st.vis));
  } else if (st.out) {
    const o = cellBox("out full", "Out", st.out); P.appendChild(o);
  }
  // long cells: set the code a little smaller so that everything fits
  const big = codeLines + outLines > 20 || (st.vis && codeLines > 10);
  P.querySelectorAll("pre").forEach((pre) => { if (big) pre.style.fontSize = "19px"; });
}

// ---- the live step: the same model, trained in the page -----------------------------
const BLOCK = 3, D = 2, HID = 64;
function examples(words) {
  const X = [], Y = [];
  for (const w of words) { let c = [0, 0, 0]; for (const ch of w + ".") { X.push(c); Y.push(IDX[ch]); c = [c[1], c[2], IDX[ch]]; } }
  return { X, Y };
}
const TR = examples(LESSON.train), VA = examples(LESSON.val);
const INIT = STEPS.find((s) => s.init).init;
let P0;   // {E: V*D, W1: 6*HID (in, out), b1, W2: HID*V (in, out), b2}
function initParams() { P0 = Object.fromEntries(Object.keys(INIT).map((k) => [k, Float64Array.from(INIT[k])])); }
function forward(ctx, Q = P0) {
  const e = new Float64Array(BLOCK * D), hh = new Float64Array(HID), p = new Float64Array(V);
  for (let j = 0; j < BLOCK; j++) for (let d = 0; d < D; d++) e[j * D + d] = Q.E[ctx[j] * D + d];
  for (let u = 0; u < HID; u++) { let s = Q.b1[u]; for (let i = 0; i < BLOCK * D; i++) s += e[i] * Q.W1[i * HID + u]; hh[u] = Math.tanh(s); }
  let mx = -Infinity;
  for (let v = 0; v < V; v++) { let s = Q.b2[v]; for (let u = 0; u < HID; u++) s += hh[u] * Q.W2[u * V + v]; p[v] = s; if (s > mx) mx = s; }
  let Z = 0; for (let v = 0; v < V; v++) { p[v] = Math.exp(p[v] - mx); Z += p[v]; }
  for (let v = 0; v < V; v++) p[v] /= Z;
  return { e, h: hh, p };
}
function lossOn(S) { let s = 0; for (let i = 0; i < S.X.length; i++) s -= Math.log(Math.max(1e-300, forward(S.X[i]).p[S.Y[i]])); return s / S.X.length; }
function sgdStep(idx, lr, wd = 0) {   // forward, mean cross-entropy, backpropagation, then w <- w - lr * (grad + wd * w)
  const G = Object.fromEntries(Object.keys(P0).map((k) => [k, new Float64Array(P0[k].length)]));
  const B = idx.length; let loss = 0;
  for (const i of idx) {
    const ctx = TR.X[i], y = TR.Y[i], { e, h: hh, p } = forward(ctx);
    loss -= Math.log(Math.max(1e-300, p[y])) / B;
    const dz = Float64Array.from(p, (q, v) => (q - (v === y ? 1 : 0)) / B), dh = new Float64Array(HID);
    for (let u = 0; u < HID; u++) { let s = 0; for (let v = 0; v < V; v++) { G.W2[u * V + v] += hh[u] * dz[v]; s += P0.W2[u * V + v] * dz[v]; } dh[u] = s * (1 - hh[u] * hh[u]); }
    for (let v = 0; v < V; v++) G.b2[v] += dz[v];
    for (let i2 = 0; i2 < BLOCK * D; i2++) { let s = 0; for (let u = 0; u < HID; u++) { G.W1[i2 * HID + u] += e[i2] * dh[u]; s += P0.W1[i2 * HID + u] * dh[u]; }
      G.E[ctx[Math.floor(i2 / D)] * D + (i2 % D)] += s; }
    for (let u = 0; u < HID; u++) G.b1[u] += dh[u];
  }
  for (const k in P0) { const w = P0[k], g = G[k]; for (let j = 0; j < w.length; j++) w[j] -= lr * (g[j] + wd * w[j]); }
  return loss;
}
let L = null;   // the live state
function liveReset() { initParams(); L = { step: 0, acc: [], hist: [], val: [[0, lossOn(VA)]], samples: [], running: false }; }
function liveStep() {
  const B = +document.getElementById("bs").value || TR.X.length, lr = +document.getElementById("lr").value, wd = +document.getElementById("wd").value;
  const idx = B >= TR.X.length ? TR.X.map((_, i) => i) : Array.from({ length: B }, () => Math.floor(Math.random() * TR.X.length));
  const l = sgdStep(idx, lr, wd); L.step++; L.acc.push(l);
  if (L.step % 100 === 0) { L.hist.push([L.step - 50, L.acc.reduce((a, b) => a + b, 0) / L.acc.length]); L.acc = []; L.val.push([L.step, lossOn(VA)]); }
  L.last = l;
}
function sample(n = 8) {
  const out = [];
  for (let s = 0; s < n; s++) {
    let c = [0, 0, 0], w = "";
    while (w.length < 16) { const p = forward(c).p; let r = Math.random(), v = 0; for (; v < V - 1; v++) { r -= p[v]; if (r <= 0) break; }
      if (v === 0) break; w += CH[v]; c = [c[1], c[2], v]; }
    out.push(w + (LESSON.train.includes(w) ? "  (a training name)" : ""));
  }
  return out;
}
function showLive() {
  if (!L) liveReset();
  const P = document.getElementById("panel"); P.innerHTML = "";
  P.insertAdjacentHTML("beforeend", `<div class="ctl">
    <button id="bTrain" class="primary">${L.running ? "Pause" : "Train"}<kbd>T</kbd></button>
    <button id="bOne">One step<kbd>N</kbd></button>
    <button id="bReset">Reset<kbd>R</kbd></button>
    <label for="lr">lr</label><select id="lr">${[0.03, 0.3, 1, 3, 10].map((v) => `<option${v === 0.3 ? " selected" : ""}>${v}</option>`).join("")}</select>
    <label for="wd">weight decay</label><select id="wd">${[0, 0.001, 0.01, 0.03].map((v) => `<option${v === 0 ? " selected" : ""}>${v}</option>`).join("")}</select>
    <label for="bs">batch</label><select id="bs">${[1, 8, 64, 0].map((v) => `<option value="${v}"${v === 64 ? " selected" : ""}>${v || "all"}</option>`).join("")}</select>
    <button id="bSample">Sample names<kbd>S</kbd></button></div>`);
  const stat = h("div", "stat", P);
  const row = h("div", "row", P);
  const curve = h("div", "vis", row), emb = h("div", "vis", row);
  curve.style.flexBasis = "58%"; emb.style.flexBasis = "42%";
  const sm = h("div", "cell out", P); sm.style.flex = "0 0 auto";
  h("div", "lab", sm).appendChild(h("span", "", null, "sampled names"));
  const smp = h("div", "samples", sm);
  const draw = () => {
    stat.textContent = `step ${L.step}   minibatch loss ${L.last === undefined ? "–" : L.last.toFixed(3)}   validation loss ${L.val[L.val.length - 1][1].toFixed(3)}`;
    curve.innerHTML = ""; emb.innerHTML = "";
    drawCurve(curve, { xmax: Math.max(1000, Math.ceil(L.step / 1000) * 1000), xlabel: "step", ref: Math.log(V),
      series: [{ name: "minibatch loss (mean of 100 steps)", pts: L.hist, c: "line" }, { name: "validation loss", pts: L.val, c: "err" }] });
    drawEmb(emb, { E: Array.from(P0.E) });
    smp.textContent = L.samples.length ? L.samples.join("   ") : "press S to sample names from the model";
  };
  L.draw = draw;
  const q = new URLSearchParams(location.hash.slice(1));
  for (const id of ["lr", "wd", "bs"]) if (q.has(id)) document.getElementById(id).value = q.get(id);
  if (q.has("train") && L.step === 0) { const n = +q.get("train"); while (L.step < n) liveStep(); L.samples = sample(); }
  requestAnimationFrame(draw);
  document.getElementById("bTrain").onclick = toggleTrain;
  document.getElementById("bOne").onclick = () => { liveStep(); draw(); };
  document.getElementById("bReset").onclick = () => { L.running = false; liveReset(); showLive(); };
  document.getElementById("bSample").onclick = () => { L.samples = sample(); draw(); };
}
function toggleTrain() {
  L.running = !L.running; document.getElementById("bTrain").firstChild.textContent = L.running ? "Pause" : "Train";
  const tick = () => { if (!L.running || cur !== N - 1) return; const t0 = performance.now();
    while (performance.now() - t0 < 25) liveStep(); L.draw(); requestAnimationFrame(tick); };
  if (L.running) requestAnimationFrame(tick);
}

// ---- the slides --------------------------------------------------------------------------
let cur = 0;
function layout() {
  const st = document.getElementById("stage"), slot = document.getElementById("slot");
  if (PANEL_ONLY) return;
  const navH = document.fullscreenElement || document.body.classList.contains("nonav") ? 0 : 52;
  const W = Math.min(innerWidth, (innerHeight - navH) * 16 / 9), H = W * 9 / 16;
  st.style.top = (innerHeight - navH) / 2 + "px";
  st.style.width = W + "px"; st.style.height = H + "px"; st.style.fontSize = (W / 1920 * 16) + "px";
  const sl = SL && SL.pages[cur];
  const box = sl ? sl.box : [0.46, 0.17, 0.5, 0.5 * 16 / 9 * PANEL_H / PANEL_W];   // fractions of the slide
  slot.style.left = box[0] * W + "px"; slot.style.top = box[1] * H + "px";
  slot.style.width = box[2] * W + "px"; slot.style.height = box[3] * H + "px";
  document.getElementById("panel").style.transform = `scale(${box[2] * W / PANEL_W})`;
  st.style.backgroundImage = sl ? `url("${SL.dir}${sl.img}")` : "none";
  const fb = document.getElementById("fallback"); fb.style.display = sl ? "none" : "block"; fb.textContent = STEPS[cur].title;
}
function show(k) {
  cur = Math.max(0, Math.min(N - 1, k));
  if (L) L.running = false;
  if (!location.hash.includes("step=" + (cur + 1) + "&")) history.replaceState(null, "", location.search + "#step=" + (cur + 1));
  document.getElementById("pick").value = cur;
  document.getElementById("count").textContent = `${cur + 1} / ${N}`;
  layout();
  if (STEPS[cur].live) showLive(); else showCell(cur);
}
const pick = document.getElementById("pick");
STEPS.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${i + 1}. ${s.title}`; pick.appendChild(o); });
pick.onchange = () => show(+pick.value);
document.getElementById("bBack").onclick = () => show(cur - 1);
document.getElementById("bNext").onclick = () => show(cur + 1);
document.getElementById("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || (k === " " && !STEPS[cur].live)) { show(cur + 1); e.preventDefault(); }
  else if (k === "ArrowLeft" || k === "PageUp") { show(cur - 1); e.preventDefault(); }
  else if (k === "Home") show(0);
  else if (k === "End") show(N - 1);
  else if (k === "f" || k === "F") document.getElementById("bFull").click();
  else if (STEPS[cur].live) {
    if (k === "t" || k === "T") toggleTrain();
    else if (k === "n" || k === "N") document.getElementById("bOne").click();
    else if (k === "r" || k === "R") document.getElementById("bReset").click();
    else if (k === "s" || k === "S") document.getElementById("bSample").click();
  }
});
let navT;
addEventListener("mousemove", (e) => { if (!e.movementX && !e.movementY) return; const n = document.getElementById("nav"); n.classList.add("show"); clearTimeout(navT); navT = setTimeout(() => n.classList.remove("show"), 1800); });
// without a keyboard: tap the slide (its left quarter goes back), or swipe
if (/[#&]nonav\b/.test(location.hash)) document.body.classList.add("nonav");   // for screenshots
document.getElementById("stage").addEventListener("click", (e) => {
  if (e.target.closest("#slot")) return;
  const r = e.currentTarget.getBoundingClientRect();
  show(e.clientX - r.left < r.width / 4 ? cur - 1 : cur + 1);
});
let touchX = null, touchY = null;
addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY; touchX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) show(dx < 0 ? cur + 1 : cur - 1);
}, { passive: true });
addEventListener("resize", () => show(cur));
addEventListener("hashchange", () => { const m = location.hash.match(/step=(\d+)/); if (m && +m[1] - 1 !== cur) show(+m[1] - 1); });
const m0 = location.hash.match(/step=(\d+)/);
show(m0 ? +m0[1] - 1 : 0);
</script>
